# Warm Burnout
# by Felipe Lima - https://warmburnout.com
#
# Ported from the canonical Warm Burnout palette (see AGENTS.md at the repo root).
# Mostly warm, rarely blue. Every dark token is WCAG AAA against #1a1510.
# UI surface colors match the VS Code and Ghostty variants (cards, status bar, selection).

version: 1
title: Warm Burnout
palette:
  dark:
    text:
      body: { rgb: "#bfbdb6" }       # Foreground
      muted: { rgb: "#ada69c" }      # VS Code secondary UI foreground
      dim: { rgb: "#8a8178" }        # Activity bar top foreground
    surface:
      app: { rgb: "#1a1510" }        # Canonical dark background
      floating: { rgb: "#1f1d17" }   # VS Code editor widget background
      card: { rgb: "#1f1d17" }
      system_reminder: { rgb: "#1f1d17" }
      status_bar: { rgb: "#14120f" } # VS Code sidebar/panel background
      focus_ring: { rgb: "#33393a" } # Ghostty selection background
      selection: { rgb: "#33393a" }  # Ghostty selection background
      input: { rgb: "#14120f" }      # VS Code input background
    semantic:
      error: { rgb: "#f49090" }      # Canonical error/invalid
      warning: { rgb: "#ffb454" }    # Canonical functions amber
      success: { rgb: "#b4bc78" }    # Canonical strings sage
      info: { rgb: "#90aec0" }       # Canonical type accent (the one cool color)
    chrome:
      accent: { rgb: "#ffb454" }     # Readable accent for text; #b8522e stays on badges/buttons
      border: { rgb: "#26211c" }     # widget.border overlay composited over app background
      expansion_indicator: { rgb: "#bfbdb6" }
      detail_bar: { rgb: "#ada69c" }
      facet: { rgb: "#e6c08a" }      # Canonical decorators
      ask_user_question: { rgb: "#ec9878" } # Canonical member vars
      subagent: { rgb: "#b4bc78" }   # Canonical strings
      goal: { rgb: "#ffb454" }
    reference:
      resolved: { rgb: "#b4bc78" }
      unresolved: { rgb: "#f49090" }
    model_family:
      claude: { rgb: "#ffb454" }
      openai: { rgb: "#90aec0" }
      gemini: { rgb: "#b4bc78" }
      kimi: { rgb: "#ec9878" }
      ollama: { rgb: "#e6c08a" }
      glm: { rgb: "#f29668" }        # Canonical operators
      deepseek: { rgb: "#90aec0" }
      mimo: { rgb: "#ec9878" }
      minimax: { rgb: "#ff8f40" }    # Canonical keywords
      nvidia: { rgb: "#76B900" }     # NVIDIA brand green
      unknown: { rgb: "#8a8178" }
    diff:
      added: { rgb: "#b4bc78" }
      removed: { rgb: "#f49090" }
      context: { rgb: "#ada69c" }
      hunk_header: { rgb: "#e6c08a" }
    syntax:
      keyword: { rgb: "#ff8f40" }    # Bold per the three-tier font system
      string: { rgb: "#b4bc78" }
      comment: { rgb: "#b4a89c" }    # Italic per the three-tier font system
      literal: { rgb: "#d4a8b8" }    # Canonical constants/numbers
      type: { rgb: "#90aec0" }       # Italic; the single cool accent
      function: { rgb: "#ffb454" }
      operator: { rgb: "#f29668" }
      number: { rgb: "#d4a8b8" }
      punctuation: { rgb: "#ada69c" }
    status_bar:
      model: { rgb: "#bfbdb6" }
      facet: { rgb: "#ff8f40" }
      monitor: { rgb: "#b4bc78" }
      monitor_bypass_plus: { rgb: "#ff8f40" }
      label: { rgb: "#bfbdb6" }
      dirty: { rgb: "#ffb454" }
    sidebar:
      pane_state_indicator: { rgb: "#ffb454" }
    inline:
      link: { rgb: "#ffb454" }
      code: { rgb: "#90aec0" }
    animation:
      completion_flash: { rgb: "#2a2415" } # Warm amber tint over app background
      error_pulse: { rgb: "#3a2222" }      # Warm red tint over app background
    emphasis:
      muted: { rgb: "#ada69c" }
  light:
    text:
      body: { rgb: "#3a3630" }       # Canonical light foreground
      muted: { rgb: "#5c5750" }      # VS Code light secondary UI foreground
      dim: { rgb: "#a09888" }        # Light indent guide tone
    surface:
      app: { rgb: "#F5EDE0" }        # Canonical light background
      floating: { rgb: "#F0E8DC" }   # VS Code light editor widget background
      card: { rgb: "#F0E8DC" }
      system_reminder: { rgb: "#F0E8DC" }
      status_bar: { rgb: "#EDE6DA" } # VS Code light sidebar/panel background
      focus_ring: { rgb: "#e5e8e2" } # Ghostty light selection background
      selection: { rgb: "#e5e8e2" }  # Ghostty light selection background
      input: { rgb: "#FAF6F0" }      # VS Code light input background
    semantic:
      error: { rgb: "#b03434" }      # Canonical light error
      warning: { rgb: "#855700" }    # Canonical light functions
      success: { rgb: "#4d5c1a" }    # Canonical light strings
      info: { rgb: "#285464" }       # Canonical light type accent
    chrome:
      accent: { rgb: "#924800" }     # Readable accent for text; #b8522e stays on badges/buttons
      border: { rgb: "#e8e1d5" }     # widget.border overlay composited over app background
      expansion_indicator: { rgb: "#3a3630" }
      detail_bar: { rgb: "#5c5750" }
      facet: { rgb: "#7a5a1c" }      # Canonical light decorators
      ask_user_question: { rgb: "#883850" } # Canonical light member vars
      subagent: { rgb: "#4d5c1a" }   # Canonical light strings
      goal: { rgb: "#855700" }
    reference:
      resolved: { rgb: "#4d5c1a" }
      unresolved: { rgb: "#b03434" }
    model_family:
      claude: { rgb: "#924800" }
      openai: { rgb: "#285464" }
      gemini: { rgb: "#4d5c1a" }
      kimi: { rgb: "#883850" }
      ollama: { rgb: "#7a5a1c" }
      glm: { rgb: "#8f4418" }        # Canonical light operators
      deepseek: { rgb: "#285464" }
      mimo: { rgb: "#883850" }
      minimax: { rgb: "#924800" }    # Canonical light keywords
      nvidia: { rgb: "#76B900" }     # NVIDIA brand green
      unknown: { rgb: "#5c5750" }
    diff:
      added: { rgb: "#4d5c1a" }
      removed: { rgb: "#b03434" }
      context: { rgb: "#5c5750" }
      hunk_header: { rgb: "#7a5a1c" }
    syntax:
      keyword: { rgb: "#924800" }    # Bold per the three-tier font system
      string: { rgb: "#4d5c1a" }
      comment: { rgb: "#544c40" }    # Italic; canonical light comments (AAA)
      literal: { rgb: "#7e4060" }    # Canonical light constants
      type: { rgb: "#285464" }       # Italic; the single cool accent
      function: { rgb: "#855700" }
      operator: { rgb: "#8f4418" }
      number: { rgb: "#7e4060" }
      punctuation: { rgb: "#3a3630" }
    status_bar:
      model: { rgb: "#3a3630" }
      facet: { rgb: "#924800" }
      monitor: { rgb: "#4d5c1a" }
      monitor_bypass_plus: { rgb: "#924800" }
      label: { rgb: "#3a3630" }
      dirty: { rgb: "#855700" }
    sidebar:
      pane_state_indicator: { rgb: "#855700" }
    inline:
      link: { rgb: "#924800" }
      code: { rgb: "#285464" }
    animation:
      completion_flash: { rgb: "#efe2c4" } # Warm amber tint over app background
      error_pulse: { rgb: "#f2dbdb" }      # Warm red tint over app background
    emphasis:
      muted: { rgb: "#5c5750" }
dark:
