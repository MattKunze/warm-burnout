  selected:
    bg:
      $ref: "#/palette/dark/surface/selection"
  # Background for selected text inside the prompt input area.
  prompt_selection:
    bg:
      $ref: "#/palette/dark/surface/selection"
  # Brief background flash when a turn completes.
  completion_flash:
    bg:
      $ref: "#/palette/dark/animation/completion_flash"
  # Background pulse animation for error states.
  error_pulse:
    bg:
      $ref: "#/palette/dark/animation/error_pulse"
