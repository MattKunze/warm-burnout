  # Dimmed italic text for secondary annotations such as command aliases and theme source labels.
  muted_emphasis:
    fg:
      $ref: "#/palette/dark/emphasis/muted"
    i: true
  # Dim reddish background tint for the prompt area in local command mode (`!`).
  command_mode_background:
    bg:
      rgb: "#33201a"
  # Brighter reddish background tint for the prompt area in shared command mode (`!!`).
  command_mode_background_bright:
    bg:
      rgb: "#452a20"
  # Dim blueish background tint for the prompt area in slash command mode (`/`).
  slash_mode_background:
    bg:
      rgb: "#22282c"
  # Blue foreground for the `/` trigger character and `Slash Mode` label in slash command mode.
  slash_mode_foreground:
    fg:
      $ref: "#/palette/dark/semantic/info"
